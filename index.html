<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate | RewD Gaming</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#090b18,#25104f,#08162f);
background-size:400% 400%;
animation:bg 10s ease infinite;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:25px;
padding:30px;
text-align:center;
box-shadow:0 0 40px rgba(138,43,226,.5);
}

.logo{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
opacity:.8;
margin-bottom:25px;
}

.qr{
width:250px;
border-radius:20px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 25px cyan;
}

.qr:hover{
transform:scale(1.05);
}

.bank{
margin-top:20px;
font-size:26px;
font-weight:bold;
color:#00ffcc;
}

.name{
margin-top:15px;
font-size:20px;
}

.stk{
font-size:30px;
font-weight:bold;
margin:15px;
color:#9be7ff;
}

button{
padding:15px 30px;
border:none;
border-radius:12px;
background:#8a2be2;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#6d16c7;
transform:scale(1.05);
}

.note{
margin-top:25px;
background:rgba(255,255,255,.05);
padding:15px;
border-radius:15px;
line-height:28px;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">
🎮 RewD Gaming
</div>

<div class="sub">
Cảm ơn bạn đã ủng hộ mình ❤️
</div>

<img src="qr.png" class="qr">

<div class="bank">
Vietcombank
</div>

<div class="name">
NGUYEN QUOC DUNG
</div>

<div class="stk">
1021613372
</div>

<button onclick="copy()">
📋 Sao chép STK
</button>

<div class="note">

<b>Nội dung chuyển khoản</b>

<br><br>

Tên + Lời nhắn

<br><br>

Ví dụ:

<br>

RewD - Chúc anh live vui vẻ ❤️

</div>

</div>

<script>

function copy(){

navigator.clipboard.writeText("1021613372");

alert("Đã sao chép số tài khoản");

}

</script>

</body>
</html>
